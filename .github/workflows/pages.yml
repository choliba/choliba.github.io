name: Pages

# Publica https://choliba.github.io/ a partir de docs/ em choliba/choliba.
# Disparado por repository_dispatch (docs.yml no código) ou à mão.
on:
  repository_dispatch:
    types: [publish-docs]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar choliba/choliba
        uses: actions/checkout@v4
        with:
          repository: choliba/choliba
          ref: master
          fetch-depth: 0

      - name: Ler a versão do Bun em package.json
        id: bun
        run: echo "version=$(jq -r '.packageManager | sub("^bun@"; "")' package.json)" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - uses: actions/configure-pages@v5

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Gerar o site
        run: bun run docs:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
